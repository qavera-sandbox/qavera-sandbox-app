name: qavera-sandbox-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: qaveraTriggerId
    displayName: Opaque trigger identifier supplied by Qavera (optional)
    type: string
    default: ""

pool:
  name: Default

steps:
  - task: NodeTool@0
    displayName: Set up Node.js
    inputs:
      versionSpec: "22.x"

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install Playwright browsers

  - script: npx playwright test
    displayName: Run tests
    env:
      CI: "true"
      QAVERA_TRIGGER_ID: ${{ parameters.qaveraTriggerId }}

  - task: PublishPipelineArtifact@1
    displayName: Publish Playwright report
    condition: always()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report
